[project]
name = "habitude-backend"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "sqlmodel>=0.0.22",
    "alembic>=1.14",
    "uvicorn>=0.32",
    "argon2-cffi>=23.1",
    "pydantic-settings>=2.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "httpx>=0.28",
    "ruff>=0.8",
    "mypy>=1.13",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N", "ANN", "RUF", "DTZ", "T20"]
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
"app/migrations/versions/*.py" = ["N999"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
files = ["app", "tests", "scripts"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q -m 'not perf' --cov=app --cov-report=term-missing --cov-fail-under=85"
markers = [
    "perf: performance budget tests (skipped by default)",
]

[tool.coverage.run]
omit = ["app/migrations/*"]
